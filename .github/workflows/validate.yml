name: Validate Specs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpmspec:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install rpm-build
        run: dnf -y install rpm-build

      - name: Parse spec files
        run: |
          set -euo pipefail
          for spec in */*.spec; do
            echo "::group::${spec}"
            rpmspec -P "${spec}" > /dev/null
            echo "::endgroup::"
          done
