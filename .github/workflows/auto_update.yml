name: Auto Update

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Update clash-verge-rev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/update_spec.py \
            --spec clash-verge-rev/clash-verge-rev.spec \
            --repo clash-verge-rev/clash-verge-rev \
            --tag-pattern '^v([0-9]+\.[0-9]+\.[0-9]+)$'

      - name: Update n-m3u8dl-re
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/update_spec.py \
            --spec n-m3u8dl-re/n-m3u8dl-re.spec \
            --repo nilaoda/N_m3u8DL-RE \
            --tag-pattern '^v([0-9]+\.[0-9]+\.[0-9]+)(?:-beta)?$'

      - name: Commit and push changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All specs are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash-verge-rev n-m3u8dl-re
          git commit -m "chore: update specs to latest upstream releases"
          git push
